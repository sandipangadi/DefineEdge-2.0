services:
  - type: web
    name: definedge-momentum-batch-collector-v6
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 300 app_v6:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DEFINEDGE_API_TOKEN
        sync: false
      - key: DEFINEDGE_API_SECRET
        sync: false
      - key: COLLECTOR_PASSWORD
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_DRIVE_INBOX_FOLDER_ID
        sync: false
      - key: GOOGLE_DRIVE_EVIDENCE_FOLDER_ID
        sync: false
      - key: GOOGLE_DRIVE_STATUS_FOLDER_ID
        sync: false
